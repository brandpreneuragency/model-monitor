services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: model_monitor
      POSTGRES_USER: model_monitor
      POSTGRES_PASSWORD: model_monitor
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U model_monitor -d model_monitor"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
